[env]
TERM = "xterm-256color"

[shell]
program = "/usr/bin/fish"
args = ["--login"]

[font]
size = 13.0

[font.normal]
family = "Monaco"
style = "Regular"

[[keyboard.bindings]]
key = "LBracket"
mods = "Control"
chars = "\u001b"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "SpawnNewInstance"

# Theme (Everforest Dark)
[colors.primary]
background = '#2d353b'
foreground = '#d3c6aa'
# Normal colors
[colors.normal]
black   = '#475258'
red     = '#e67e80'
green   = '#a7c080'
yellow  = '#dbbc7f'
blue    = '#7fbbb3'
magenta = '#d699b6'
cyan    = '#83c092'
white   = '#d3c6aa'
# Bright colors
[colors.bright]
black   = '#475258'
red     = '#e67e80'
green   = '#a7c080'
yellow  = '#dbbc7f'
blue    = '#7fbbb3'
magenta = '#d699b6'
cyan    = '#83c092'
white   = '#d3c6aa'

