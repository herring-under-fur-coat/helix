[env]
TERM = "xterm-256color"

[shell]
program = "/usr/bin/fish"
args = ["--login"]

[font]
size = 13.0

[font.normal]
family = "Monaco"
style = "Regular"

[[keyboard.bindings]]
key = "LBracket"
mods = "Control"
chars = "\u001b"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "SpawnNewInstance"

# Theme (Everforest Light)
[colors.primary]
background = '#fdf6e3'
foreground = '#5c6a72'
[colors.normal]
black   = '#5c6a72'
red     = '#f85552'
green   = '#8da101'
yellow  = '#dfa000'
blue    = '#3a94c5'
magenta = '#df69ba'
cyan    = '#35a77c'
white   = '#e0dcc7'
[colors.bright]
black   = '#5c6a72'
red     = '#f85552'
green   = '#8da101'
yellow  = '#dfa000'
blue    = '#3a94c5'
magenta = '#df69ba'
cyan    = '#35a77c'
white   = '#e0dcc7'
